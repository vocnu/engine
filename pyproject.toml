[project]
name = "vocnu-engine"
version = "0.2.0"
description = "AI voice-over and subtitles for videos: speech recognition, translation, narration timing and mixing"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Vocnu (JAD Tech MB)", email = "support@vocnu.com" }]
requires-python = ">=3.12,<3.13"
keywords = ["voice-over", "dubbing", "subtitles", "translation", "whisper", "tts", "video"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "faster-whisper>=1.2",
  "numpy>=2.0",
  "requests>=2.32",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[project.urls]
Homepage = "https://vocnu.com"
Source = "https://github.com/vocnu/engine"
Issues = "https://github.com/vocnu/engine/issues"

[project.scripts]
vocnu-engine = "vocnu_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vocnu_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs network, a GPU or paid provider APIs"]
addopts = "-m 'not integration'"
